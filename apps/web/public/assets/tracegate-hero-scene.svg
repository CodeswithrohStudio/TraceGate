<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">TraceGate release evidence scene</title>
  <desc id="desc">A dark observability workspace showing traces flowing into a blocked release gate.</desc>
  <rect width="1600" height="1000" fill="#0b1014"/>
  <g opacity="0.22" stroke="#e9f3fe" stroke-width="1.2">
    <path d="M110 700 L650 520 L1490 255"/>
    <path d="M200 300 L720 420 L1510 610"/>
    <path d="M1250 150 L720 320 L210 560"/>
  </g>
  <g opacity="0.95">
    <rect x="980" y="210" width="420" height="300" rx="12" fill="#161b20" stroke="#22272c"/>
    <rect x="1015" y="245" width="350" height="108" rx="8" fill="#0b1014" stroke="#e97486"/>
    <rect x="1034" y="264" width="78" height="24" rx="4" fill="#e97486"/>
    <text x="1050" y="281" fill="#0b1014" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="700">BLOCKED</text>
    <text x="1034" y="322" fill="#e9f3fe" font-family="Archivo, sans-serif" font-size="32" font-weight="800">Retry budget failed</text>
    <text x="1035" y="386" fill="#9fb0bf" font-family="IBM Plex Mono, monospace" font-size="15">agent.run</text>
    <text x="1035" y="430" fill="#9fb0bf" font-family="IBM Plex Mono, monospace" font-size="15">llm.call</text>
    <text x="1035" y="474" fill="#9fb0bf" font-family="IBM Plex Mono, monospace" font-size="15">tool.trace.lookup</text>
    <rect x="1180" y="374" width="145" height="16" rx="4" fill="#1a2f47" stroke="#2676c6"/>
    <rect x="1180" y="418" width="110" height="16" rx="4" fill="#1a2f47" stroke="#2676c6"/>
    <rect x="1180" y="462" width="185" height="16" rx="4" fill="#1a2f47" stroke="#e97486"/>
  </g>
  <g>
    <rect x="190" y="560" width="520" height="226" rx="14" fill="#161b20" stroke="#22272c"/>
    <text x="226" y="614" fill="#e9f3fe" font-family="Archivo, sans-serif" font-size="30" font-weight="800">Ship decision</text>
    <text x="226" y="650" fill="#9fb0bf" font-family="IBM Plex Sans, sans-serif" font-size="18">Every risky agent path leaves evidence before deploy.</text>
    <rect x="226" y="690" width="122" height="44" rx="6" fill="#2676c6"/>
    <text x="252" y="718" fill="#ffffff" font-family="IBM Plex Sans, sans-serif" font-size="16" font-weight="700">7 / 8 pass</text>
    <rect x="366" y="690" width="126" height="44" rx="6" fill="#0b1014" stroke="#e97486"/>
    <text x="394" y="718" fill="#e97486" font-family="IBM Plex Sans, sans-serif" font-size="16" font-weight="700">1 blocks</text>
    <path d="M540 712 H650" stroke="#e97486" stroke-width="3"/>
    <circle cx="650" cy="712" r="8" fill="#e97486"/>
  </g>
  <g opacity="0.9">
    <circle cx="830" cy="505" r="8" fill="#2676c6"/>
    <circle cx="905" cy="480" r="8" fill="#e97486"/>
    <circle cx="760" cy="620" r="8" fill="#2676c6"/>
    <path d="M710 620 C790 565 845 535 980 462" fill="none" stroke="#2676c6" stroke-width="3"/>
    <path d="M710 712 C815 675 890 600 1015 318" fill="none" stroke="#e97486" stroke-width="3"/>
  </g>
  <g opacity="0.38">
    <text x="94" y="150" fill="#9fb0bf" font-family="IBM Plex Mono, monospace" font-size="14">service.name = tracegate-demo-agent</text>
    <text x="1040" y="760" fill="#9fb0bf" font-family="IBM Plex Mono, monospace" font-size="14">span: tool.trace.lookup · retries=3</text>
    <text x="1110" y="815" fill="#9fb0bf" font-family="IBM Plex Mono, monospace" font-size="14">maxToolRetries: 1</text>
  </g>
</svg>
